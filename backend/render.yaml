databases:
  - name: automl-db
    databaseName: automldb
    user: automluser

services:
  - type: web
    name: automl-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: automl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "automl-backend.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
